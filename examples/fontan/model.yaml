id: fontan-sim-results-example
title: Fontan Simulation Results Example
description: Two timesteps from a Fontan simulation result bundled into the repo as a compact Git LFS example.
default_scalar:
  name: Concentration
  mode: scalar
visualizations:
  glyphs:
    - id: velocity-glyphs
      label: Velocity glyphs
      part: flow
      vectors: Velocity
      scale_factor: 0.01
      density: 5000
      color_by:
        name: Velocity
        mode: magnitude
parts:
  - id: flow
    label: Flow domain
    color: "#8C1515"
    files:
      - path: result_7200.vtu
        label: "7200"
      - path: result_7232.vtu
        label: "7232"
